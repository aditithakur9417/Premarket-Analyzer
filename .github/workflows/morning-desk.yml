# Morning Premarket Desk — fetch + Gemini + email
#
# Triggered by cron-job.org (or Actions → Run workflow).
# Setup: docs/GITHUB_ACTIONS.md §6

name: Morning Desk

on:
  # External free cron (cron-job.org) + manual runs.
  # Native GitHub schedule removed to avoid double emails.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: morning-desk
  cancel-in-progress: false

jobs:
  run-desk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      PYTHONPATH: ${{ github.workspace }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      LLM_PROVIDER: gemini
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-flash-latest
      USE_LLM_DEFAULT: "true"
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: "587"
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_FROM: ${{ secrets.SMTP_FROM }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      SMTP_USE_TLS: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: NSE holiday check
        id: holiday
        run: |
          python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from premarket.calendar_nse import NSE_HOLIDAYS_2026, is_trading_day, set_holiday_provider
          set_holiday_provider(lambda: set(NSE_HOLIDAYS_2026))
          today = datetime.now(ZoneInfo("Asia/Kolkata")).date()
          trading = is_trading_day(today)
          print(f"today={today} trading_day={trading}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"trading={'true' if trading else 'false'}\n")
          PY

      - name: Fetch, analyze, email
        if: steps.holiday.outputs.trading == 'true'
        run: python manual_run.py --email --llm --force

      - name: Skipped holiday notice
        if: steps.holiday.outputs.trading != 'true'
        run: echo "NSE holiday/weekend — no email sent."
